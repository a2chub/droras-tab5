; M5Stack Tab5 (ESP32-P4) / PlatformIO + ESP-IDF
[platformio]
default_envs = tab5

[env:tab5]
; pioarduino fork: the official PlatformIO espressif32 platform has no ESP32-P4 support.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = m5stack-tab5-p4
framework = espidf

; The PlatformIO builder takes the partition table from here and ignores the
; CONFIG_PARTITION_TABLE_* choice in sdkconfig, so keep both pointing at this file.
board_build.partitions = partitions.csv

; Files linked into the firmware (see EMBED_FILES in src/CMakeLists.txt).
board_build.embed_files =
    assets/fonts/ipaexg.ttf
    assets/test/gesture.jpg

; upload_port / monitor_port are left to auto-detection on purpose: the device name
; (/dev/cu.usbmodemXXXX) changes with the USB port in use, and this platform does not
; expand wildcards. If several USB serial devices are attached, pass --upload-port.
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Host-side unit tests for the hardware-independent logic in components/heatboard_core.
; Run with: pio test -e native
[env:native]
platform = native
test_framework = unity
lib_extra_dirs = components
build_flags = -std=c++17 -Wall -Wextra
test_ignore = test_wifi_station

; Driver-facing Wi-Fi integration tests, with an in-memory ESP-IDF/NVS substitute.
[env:native_wifi_station]
extends = env:native
test_filter = test_wifi_station
test_ignore =
build_flags = ${env:native.build_flags} -Itest/test_wifi_station/stubs -DHEATBOARD_WIFI_NO_BUILD_PRESETS
