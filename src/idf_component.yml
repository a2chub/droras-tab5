dependencies:
  idf: ">=5.5"
  # Pulls in m5stack/m5gfx (display, touch, Japanese fonts) as a transitive dependency.
  m5stack/m5unified: "^0.2.25"
  # The ESP32-P4 has no radio: Wi-Fi runs on the Tab5's ESP32-C6 co-processor, reached over
  # SDIO by esp_hosted and exposed through the regular esp_wifi API by esp_wifi_remote.
  espressif/esp_wifi_remote: "^1.6.5"
  # Held on 2.x: 3.x injects a two-token "-include <file>" compile option that the PlatformIO
  # ESP-IDF builder splits apart, which breaks every compile command.
  espressif/esp_hosted: "^2"
  espressif/esp_websocket_client: "^1.8.0"
  # TrueType rasteriser for the embedded IPAex Gothic font: the bitmap fonts bundled with
  # M5GFX stop at JIS level 1 and cannot show many surnames (邉, 螻, 髙, ...).
  espressif/freetype: "^2.14.3"
  # Camera: V4L2-style capture from the Tab5's MIPI-CSI sensor (SC2356, driven by the
  # SC202CS driver in esp_cam_sensor, pulled in transitively) through the P4's ISP.
  espressif/esp_video: "^2.5.0"
  # Hand gesture operation of the buttons: a hand detector plus a gesture classifier on
  # top of ESP-DL (pulled in transitively).
  espressif/hand_detect: "^0.2.0"
  espressif/hand_gesture_recognition: "^0.2.0"
